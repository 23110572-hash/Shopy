services:
  - type: web
    name: shopy-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: "python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt"
    preDeployCommand: "python -m alembic -c database/alembic.ini upgrade head"
    startCommand: 'python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"'
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_NAME
        value: Shopy
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SQL_ECHO
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://shopy-ochre.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_APP_TITLE
        value: Shopy
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MANDATE_SIGNING_SECRET
        generateValue: true
      - key: AUDIT_SIGNING_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
